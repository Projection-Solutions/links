<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indexed Link Directory</title>
    <style>
        :root {
            --primary: #2563eb;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.5;
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--primary);
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.75rem;
        }

        ol {
            padding-left: 1.25rem;
            margin: 0;
        }

        li {
            margin-bottom: 1rem;
            padding-left: 0.25rem;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            word-break: break-all;
        }

        a:hover {
            text-decoration: underline;
        }

        .url-description {
            font-size: 0.9rem;
            color: #64748b;
            margin-top: 0.2rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Indexed Link Directory</h1>
    <ol>
        <li>
            <a href="https://www.urmc.rochester.edu/news/story/creating-the-model-human-to-practice-surgery" target="_blank" rel="noopener">Creating the Model Human to Practice Surgery</a>
            <div class="url-description">URMC News & Stories</div>
        </li>
    </ol>
</div>

</body>
</html>
